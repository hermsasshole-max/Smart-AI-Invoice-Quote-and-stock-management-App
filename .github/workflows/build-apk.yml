name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🤖 Set up Android SDK & Accept Licenses
        run: |
          echo "Setting up Android SDK environment..."
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          
          # Pre-accept all standard and preview Android SDK licenses to prevent build failures
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          
          # Accept licenses via sdkmanager if present
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🟢 Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Node Dependencies
        run: |
          npm install

      - name: 🏗️ Build Vite Web App
        run: |
          npm run build:web
        env:
          VITE_API_BASE_URL: https://smart-ai-invoice-quote-and-stock-y242.onrender.com

      - name: ⚡ Initialize & Sync Capacitor Android
        run: |
          # If android directory is missing or incomplete (missing gradlew), re-add android platform
          if [ ! -f "android/gradlew" ]; then
            echo "Android platform missing or incomplete. Initializing fresh Capacitor Android platform..."
            rm -rf android
            npx cap add android
          fi
          # Ensure SDK 35 is pinned in variables.gradle for guaranteed compatibility
          if [ -f "android/variables.gradle" ]; then
            sed -i "s/compileSdkVersion = .*/compileSdkVersion = 35/g" android/variables.gradle
            sed -i "s/targetSdkVersion = .*/targetSdkVersion = 35/g" android/variables.gradle
          fi
          echo "Syncing web assets and plugins to Android project..."
          npx cap sync android

      - name: 🔒 Ensure Android Permissions
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "CAMERA" "$MANIFEST_FILE"; then
              sed -i '/<\/application>/a \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST_FILE"
            fi
          fi

      - name: 🔨 Grant Executable Permission to Gradlew
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          else
            echo "Warning: ./android/gradlew not found directly; looking in android/"
            find . -name "gradlew" -exec chmod +x {} +
          fi

      - name: 🚀 Build Debug APK with Gradle
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx1536m"
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-ai-invoice-quote-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
