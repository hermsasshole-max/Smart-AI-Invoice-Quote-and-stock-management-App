name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🟢 Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Node Dependencies
        run: |
          npm install

      - name: 🏗️ Build Vite Web App
        run: |
          npm run build:web
        env:
          VITE_API_BASE_URL: https://smart-ai-invoice-quote-and-stock-y242.onrender.com

      - name: ⚡ Initialize & Sync Capacitor Android
        run: |
          # If android directory is missing or incomplete (missing gradlew), re-add android platform
          if [ ! -f "android/gradlew" ]; then
            echo "Android platform missing or incomplete. Initializing fresh Capacitor Android platform..."
            rm -rf android
            npx cap add android
          fi
          echo "Syncing web assets and plugins to Android project..."
          npx cap sync android

      - name: 🔒 Configure Android Permissions (Camera & Internet)
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            # Ensure Internet, Camera, and Network state permissions exist
            if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' "$MANIFEST_FILE"
            fi
          fi

      - name: 🔨 Grant Executable Permission to Gradlew
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          else
            echo "Warning: ./android/gradlew not found directly; looking in android/"
            find . -name "gradlew" -exec chmod +x {} +
          fi

      - name: 🚀 Build Debug APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-ai-invoice-quote-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
